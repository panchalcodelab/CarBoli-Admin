services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: car_boli
      DB_USERNAME: carboli
      DB_PASSWORD: carboli
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - laravel-storage:/var/www/html/storage

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    ports:
      - "8000:80"
    depends_on:
      - app

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: car_boli
      MYSQL_USER: carboli
      MYSQL_PASSWORD: carboli
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -ucarboli -pcarboli"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  laravel-storage:
  mysql-data:
